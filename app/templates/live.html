<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📡 Faster R-CNN Live Detection</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0b0b0b;
            color: #fff;
            font-family: 'Segoe UI', Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        h2 {
            color: #e63946;
            margin-bottom: 20px;
            font-size: 24px;
        }
        .container {
            max-width: 680px;
            margin: 0 auto;
        }
        .video-container {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-width: 100%;
        }
        video {
            display: block;
            width: 100%;
            height: auto;
            background: #000;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: crosshair;
            z-index: 10;
            pointer-events: none;
        }
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        #cameraSelect {
            background: rgba(230, 57, 70, 0.2);
            color: #fff;
            border: 2px solid #e63946;
            border-radius: 8px;
            padding: 10px 16px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        #cameraSelect:hover {
            background: rgba(230, 57, 70, 0.3);
        }
        #cameraSelect option {
            background: #1a1a1a;
            color: #fff;
        }
        button {
            background: linear-gradient(135deg, #e63946, #d62828);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(230, 57, 70, 0.3);
        }
        button:hover {
            background: linear-gradient(135deg, #d62828, #a71228);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(230, 57, 70, 0.4);
        }
        button:active {
            transform: translateY(0);
        }
        .info-panel {
            margin-top: 20px;
            background: rgba(255,255,255,0.08);
            border-left: 4px solid #e63946;
            border-radius: 8px;
            padding: 15px;
        }
        #count {
            color: #4caf50;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        #status {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 10px;
        }
        #detections {
            background: rgba(0,0,0,0.3);
            border-radius: 6px;
            padding: 12px;
            text-align: left;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #4caf50;
            max-height: 200px;
            overflow-y: auto;
            line-height: 1.6;
        }
        #detections::-webkit-scrollbar {
            width: 6px;
        }
        #detections::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.05);
            border-radius: 3px;
        }
        #detections::-webkit-scrollbar-thumb {
            background: rgba(230, 57, 70, 0.5);
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>📸 Faster R-CNN Live Detection</h2>
        <div class="video-container">
            <video id="camera" autoplay playsinline muted></video>
            <canvas id="overlay"></canvas>
        </div>
        <div class="controls">
            <select id="cameraSelect">
                <option value="">📷 Loading cameras...</option>
            </select>
            <button id="toggle">▶ Start Detection</button>
        </div>
        <div class="info-panel">
            <p id="count">Objects detected: 0</p>
            <p id="status">⏳ Waiting...</p>
            <div id="detections">Ready for detections...</div>
        </div>
    </div>

    <script>
        const video = document.getElementById('camera');
        const canvas = document.getElementById('overlay');
        const ctx = canvas.getContext('2d');
        const toggle = document.getElementById('toggle');
        const cameraSelect = document.getElementById('cameraSelect');
        const countText = document.getElementById('count');
        const statusText = document.getElementById('status');
        const detBox = document.getElementById('detections');
        
        let streaming = false, intervalId;
        let currentStream = null;
        let availableCameras = [];

        async function enumerateCameras() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                availableCameras = devices.filter(device => device.kind === 'videoinput');
                
                cameraSelect.innerHTML = '';
                
                if (availableCameras.length === 0) {
                    cameraSelect.innerHTML = '<option value="">No cameras found</option>';
                    return;
                }
                
                availableCameras.forEach((camera, index) => {
                    const option = document.createElement('option');
                    option.value = camera.deviceId;
                    
                    let label = camera.label || `Camera ${index + 1}`;
                    if (label.toLowerCase().includes('back') || label.toLowerCase().includes('rear')) {
                        label += ' (Rear)';
                        if (index === 0) option.selected = true;
                    } else if (label.toLowerCase().includes('front')) {
                        label += ' (Front)';
                    }
                    
                    option.textContent = label;
                    cameraSelect.appendChild(option);
                });
                
                const rearCamera = availableCameras.find(cam => 
                    cam.label.toLowerCase().includes('back') || 
                    cam.label.toLowerCase().includes('rear')
                );
                if (rearCamera) {
                    cameraSelect.value = rearCamera.deviceId;
                }
            } catch (e) {
                console.error('Error enumerating cameras:', e);
                cameraSelect.innerHTML = '<option value="">Error accessing cameras</option>';
            }
        }

        function resizeCanvas() {
            const rect = video.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }

        async function setupCamera(deviceId = null) {
            try {
                if (currentStream) {
                    currentStream.getTracks().forEach(track => track.stop());
                }
                
                const constraints = { 
                    video: { 
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    } 
                };
                
                if (deviceId) {
                    constraints.video.deviceId = { exact: deviceId };
                } else {
                    constraints.video.facingMode = { ideal: 'environment' };
                }
                
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;
                
                await new Promise(resolve => {
                    video.onloadedmetadata = () => {
                        resizeCanvas();
                        
                        const track = currentStream.getVideoTracks()[0];
                        const settings = track.getSettings();
                        console.log(`Camera: ${settings.facingMode || 'default'}, Resolution: ${settings.width}x${settings.height}`);
                        
                        resolve();
                    };
                });
                
                statusText.textContent = "✅ Camera ready";
            } catch (e) {
                statusText.textContent = "❌ Camera access denied";
                console.error('Camera setup error:', e);
                alert("Cannot access camera: " + e.message);
            }
        }

        window.addEventListener('resize', resizeCanvas);

        cameraSelect.addEventListener('change', (e) => {
            if (streaming) {
                alert("Stop detection first to switch cameras");
                return;
            }
            setupCamera(e.target.value);
        });

        async function captureFrame() {
            try {
                const tempCanvas = document.createElement('canvas');
                const videoWidth = video.videoWidth;
                const videoHeight = video.videoHeight;
                
                tempCanvas.width = videoWidth;
                tempCanvas.height = videoHeight;
                const tempCtx = tempCanvas.getContext('2d');
                tempCtx.drawImage(video, 0, 0);
                
                tempCanvas.toBlob(async (blob) => {
                    const formData = new FormData();
                    formData.append('file', blob, 'frame.jpg');
                    
                    try {
                        const res = await fetch('/predict-image', { 
                            method: 'POST', 
                            body: formData 
                        });
                        const data = await res.json();
                        
                        drawDetections(data.detections || [], videoWidth, videoHeight);
                        countText.textContent = `Objects detected: ${data.num_detections || 0}`;
                        statusText.textContent = "🟢 Detection OK";
                        
                        if (data.detections && data.detections.length > 0) {
                            detBox.innerHTML = data.detections
                                .map((d, i) => `#${i+1} ID:${d.label_id} | Score:${(d.score).toFixed(2)} | [${Math.round(d.x_min)},${Math.round(d.y_min)},${Math.round(d.x_max)},${Math.round(d.y_max)}]`)
                                .join('<br>');
                        } else {
                            detBox.innerHTML = "🔍 No detections";
                        }
                    } catch (e) {
                        console.error(e);
                        statusText.textContent = "⚠️ Detection error";
                    }
                }, 'image/jpeg', 0.85);
            } catch (e) {
                console.error('Frame capture error:', e);
                statusText.textContent = "⚠️ Frame capture failed";
            }
        }

        function drawDetections(detections, videoWidth, videoHeight) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (!detections || detections.length === 0) return;
            
            const canvasWidth = canvas.width;
            const canvasHeight = canvas.height;
            
            const scaleX = canvasWidth / videoWidth;
            const scaleY = canvasHeight / videoHeight;
            
            detections.forEach((d, idx) => {
                let { x_min, y_min, x_max, y_max, score, label_id } = d;
                
                x_min *= scaleX;
                y_min *= scaleY;
                x_max *= scaleX;
                y_max *= scaleY;
                
                const w = x_max - x_min;
                const h = y_max - y_min;
                
                ctx.fillStyle = 'rgba(230, 57, 70, 0.2)';
                ctx.fillRect(x_min, y_min, w, h);
                
                ctx.strokeStyle = '#e63946';
                ctx.lineWidth = 3;
                ctx.strokeRect(x_min, y_min, w, h);
                
                const label = `ID:${label_id} (${score.toFixed(2)})`;
                ctx.font = 'bold 16px Arial';
                const textMetrics = ctx.measureText(label);
                const textWidth = textMetrics.width + 10;
                const textHeight = 24;
                
                ctx.fillStyle = 'rgba(230, 57, 70, 0.9)';
                ctx.fillRect(x_min, Math.max(0, y_min - textHeight), textWidth, textHeight);
                
                ctx.fillStyle = '#ffffff';
                ctx.fillText(label, x_min + 5, Math.max(16, y_min - 6));
            });
        }

        toggle.onclick = () => {
            if (!streaming) {
                streaming = true;
                toggle.textContent = "⏸ Stop Detection";
                statusText.textContent = "🟡 Detecting...";
                intervalId = setInterval(captureFrame, 800);
            } else {
                streaming = false;
                toggle.textContent = "▶ Start Detection";
                clearInterval(intervalId);
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                statusText.textContent = "⏳ Stopped";
            }
        };
        
        setupCamera();
        enumerateCameras();
    </script>
</body>
</html>
